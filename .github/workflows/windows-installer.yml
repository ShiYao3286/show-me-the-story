name: Windows Installer

# Builds the Chinese-wizard Windows installer as a downloadable artifact.
# Runs on tags (wired into release.yml), on demand, and on PRs that touch the
# packaging inputs so breakage is caught before a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label embedded in the exe and installer"
        required: false
        default: "dev"
  workflow_call:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "build/windows/**"
      - "tools/**"
      - "main.go"
      - "internal/**"
      - "frontend/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  installer:
    # NSIS + Pillow are simplest on Windows; the build is native there anyway.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # choco puts makensis under Program Files (x86); make it discoverable.
          $nsis = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsis) { Add-Content $env:GITHUB_PATH $nsis }
          & "$nsis\makensis.exe" /VERSION

      - name: Install Pillow
        shell: pwsh
        run: python -m pip install --upgrade pillow

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Generate app icon
        run: python tools/make_icon.py

      - name: Build exe + installer
        run: go run ./tools/buildwin -version "${{ steps.ver.outputs.value }}" -out dist

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $exe = "dist\show-me-the-story.exe"
          if (-not (Test-Path $exe)) { throw "exe missing" }
          $size = (Get-Item $exe).Length
          Write-Host "exe size: $size bytes"
          # GUI subsystem: no console. Launch on a distinct port, probe, then stop.
          $data = Join-Path $env:RUNNER_TEMP "smts-smoke"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:PORT = "48099"
          $p = Start-Process -FilePath $exe -ArgumentList @($data) -WorkingDirectory $data -PassThru
          $ok = $false
          foreach ($i in 1..20) {
            Start-Sleep -Milliseconds 700
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:48099/api/version" -UseBasicParsing -TimeoutSec 2
              Write-Host "version: $($r.Content)"
              $ok = $true
              break
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "exe did not serve /api/version" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ShowMeTheStory-Setup-${{ steps.ver.outputs.value }}-windows-amd64
          path: |
            dist/ShowMeTheStory-Setup-*.exe
            dist/show-me-the-story.exe
          if-no-files-found: error
          retention-days: 14
